<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>br1’s homepage | project index</title>
  <meta name="description" content="br1 portfolio — CRISPR-Cas9 and interactive experiments">
  
  <!-- Google Fonts: refined options similar to Space Grotesk style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Syne:wght@400;500;600&family=Manrope:wght@300;400;500&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    /* ----- CSS Custom Properties & Theme Setup ----- */
    :root {
      /* Light theme (default) */
      --bg: #f8f8f6;
      --surface: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #4a4a42;
      --text-muted: #6b6b60;
      --border-light: #d4d4ce;
      --border-medium: #c5c5bc;
      --hover-bg: #f0f0e8;
      --card-overlay: rgba(0, 0, 0, 0.3);
      --arrow-color: #4a4a42;
      
      /* font style variables */
      --current-font: 'Space Grotesk', sans-serif;
      --current-heading: 'Space Grotesk', sans-serif;
      
      /* distortion colors for animation */
      --distort-color1: #f44336;
      --distort-color2: #2196f3;
      --hover-text-color: #4caf50;
    }

    /* Dark theme overrides */
    [data-theme="dark"] {
      --bg: #1a1a1a;
      --surface: #252525;
      --text-primary: #f0ede8;
      --text-secondary: #bfbbb0;
      --text-muted: #9c978a;
      --border-light: #3a3a36;
      --border-medium: #4f4e46;
      --hover-bg: #2c2c28;
      --card-overlay: rgba(0,0,0,0.55);
      --arrow-color: #bfbbb0;
      --distort-color1: #ff5252;
      --distort-color2: #448aff;
      --hover-text-color: #69f0ae;
    }

    /* System preference auto theme */
    @media (prefers-color-scheme: dark) {
      [data-theme="auto"] {
        --bg: #1a1a1a;
        --surface: #252525;
        --text-primary: #f0ede8;
        --text-secondary: #bfbbb0;
        --text-muted: #9c978a;
        --border-light: #3a3a36;
        --border-medium: #4f4e46;
        --hover-bg: #2c2c28;
        --card-overlay: rgba(0,0,0,0.6);
        --arrow-color: #bfbbb0;
        --distort-color1: #ff5252;
        --distort-color2: #448aff;
        --hover-text-color: #69f0ae;
      }
    }

    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      font-family: var(--current-font);
      color: var(--text-primary);
      line-height: 1.5;
      transition: background-color 0.25s ease, color 0.2s ease;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 3.5rem 2.5rem;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* ----- HEADER ----- */
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 5rem;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 1.5rem;
      gap: 1.5rem;
    }

    .site-title {
      font-family: var(--current-heading);
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: -0.03em;
      text-decoration: none;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .site-title span {
      font-weight: 300;
      color: var(--text-secondary);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    /* Font style switcher */
    .font-switcher {
      display: flex;
      gap: 0.5rem;
      background: var(--surface);
      padding: 0.25rem;
      border-radius: 2rem;
      border: 1px solid var(--border-light);
    }

    .font-btn {
      background: transparent;
      border: none;
      padding: 0.35rem 0.9rem;
      font-size: 0.8rem;
      font-weight: 500;
      border-radius: 2rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s ease;
      font-family: inherit;
      letter-spacing: 0.02em;
    }

    .font-btn.active {
      background: var(--text-primary);
      color: var(--bg);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    /* Theme toggle group */
    .theme-toggle {
      display: flex;
      gap: 0.3rem;
      background: var(--surface);
      padding: 0.2rem;
      border-radius: 2rem;
      border: 1px solid var(--border-light);
    }

    .theme-option {
      background: transparent;
      border: none;
      padding: 0.35rem 0.9rem;
      font-size: 0.8rem;
      font-weight: 500;
      border-radius: 2rem;
      cursor: pointer;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }

    .theme-option.active {
      background: var(--text-primary);
      color: var(--bg);
    }

    /* ----- HERO SECTION ----- */
    .hero-grid {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 5rem;
      flex-wrap: wrap;
      gap: 2.5rem;
    }

    .hero-left {
      flex: 2 1 60%;
    }

    .hero-right {
      flex: 1 1 30%;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .large-heading {
      font-family: var(--current-heading);
      font-size: clamp(3.2rem, 8vw, 5.8rem);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.035em;
      color: var(--text-primary);
      margin-bottom: 1rem;
    }

    .subdued-desc {
      font-size: 1.1rem;
      font-weight: 350;
      color: var(--text-secondary);
      max-width: 440px;
      margin-top: 0.5rem;
    }

    .location-tag {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 400;
    }

    /* ----- PROJECT SHOWCASE ----- */
    .project-showcase {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border-medium);
      padding-top: 2rem;
      margin-top: 0.5rem;
    }

    /* Project card */
    .project-item {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      padding: 2.8rem 1.8rem;
      margin-bottom: 0.2rem;
      text-decoration: none;
      color: inherit;
      position: relative;
      background-size: cover;
      background-position: center 30%;
      background-repeat: no-repeat;
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1);
      border-bottom: 1px solid var(--border-light);
      overflow: hidden;
      isolation: isolate;
    }

    /* Dark overlay */
    .project-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--card-overlay);
      z-index: 1;
      transition: background 0.4s ease;
    }

    .project-item:hover::before {
      background: rgba(0, 0, 0, 0.65);
    }

    /* Background image zoom */
    .project-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: inherit;
      background-size: cover;
      background-position: center 30%;
      background-repeat: no-repeat;
      z-index: 0;
      transition: transform 0.55s ease, filter 0.3s;
      transform: scale(1);
    }

    .project-item:hover::after {
      transform: scale(1.08);
      filter: blur(0.5px) brightness(0.9);
    }

    /* Content above overlays */
    .project-title, .project-meta {
      position: relative;
      z-index: 2;
    }

    /* Project title with distortion animation */
    .project-title {
      font-family: var(--current-heading);
      font-size: 2.9rem;
      font-weight: 500;
      letter-spacing: -0.03em;
      color: #ffffff;
      line-height: 1.2;
      flex: 2 1 60%;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      transition: color 0.25s ease;
      /* Distortion animation applied via class on hover */
    }

    /* Distortion animation class (triggered on hover via JS) */
    .project-title.distort-text {
      animation: distort 400ms infinite;
    }

    /* Keyframes for text distortion */
    @keyframes distort {
      0% {
        text-shadow: 5px 4px var(--distort-color1), -5px -6px var(--distort-color2);
      }
      25% {
        text-shadow: -5px -6px var(--distort-color1), 5px 4px var(--distort-color2);
      }
      50% {
        text-shadow: 5px -4px var(--distort-color1), -8px 4px var(--distort-color2);
      }
      75% {
        text-shadow: -8px -4px var(--distort-color1), -5px -4px var(--distort-color2);
      }
      100% {
        text-shadow: -5px 0 var(--distort-color1), 5px -4px var(--distort-color2);
      }
    }

    /* Green text color on hover */
    .project-item:hover .project-title {
      color: var(--hover-text-color);
    }

    /* View label - hidden by default, visible on hover */
    .view-label {
      font-size: 1.1rem;
      font-weight: 400;
      margin-left: 0.5rem;
      display: inline-block;
      color: rgba(255,255,255,0.9);
      text-transform: lowercase;
      letter-spacing: 0.03em;
      background: rgba(0,0,0,0.4);
      padding: 0.2rem 0.9rem;
      border-radius: 2rem;
      backdrop-filter: blur(4px);
      transition: opacity 0.25s ease, background 0.2s;
      opacity: 0;
      pointer-events: none;
    }

    .project-item:hover .view-label {
      opacity: 1;
      background: rgba(0,0,0,0.65);
    }

    .project-meta {
      font-size: 1rem;
      font-weight: 350;
      color: rgba(255, 255, 255, 0.9);
      text-align: right;
      flex: 1 1 25%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-shadow: 0 2px 5px rgba(0,0,0,0.7);
    }

    .project-type {
      font-style: italic;
      font-weight: 300;
      margin-bottom: 0.2rem;
    }

    .project-domain {
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-size: 0.8rem;
      background: rgba(255,255,255,0.2);
      padding: 0.15rem 0.7rem;
      border-radius: 1rem;
    }

    /* Background images */
    .bg-crispr {
      background-image: url('https://images.unsplash.com/photo-1532187863486-6b8e50f5e5a5?q=80&w=2070&auto=format&fit=crop');
    }

    .bg-lab {
      background-image: url('https://images.unsplash.com/photo-1581093588401-fbb62a02f120?q=80&w=2070&auto=format&fit=crop');
    }

    /* Footer */
    .site-footer {
      margin-top: auto;
      padding-top: 3rem;
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 330;
    }

    .footer-left a {
      color: var(--text-primary);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    @media (max-width: 750px) {
      .container {
        padding: 2rem 1.5rem;
      }
      .project-item {
        flex-direction: column;
        align-items: flex-start;
        padding: 2rem 1.5rem;
      }
      .project-meta {
        align-items: flex-start;
        text-align: left;
        margin-top: 0.8rem;
      }
      .project-title {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header with font switcher and theme toggle -->
    <header class="site-header">
      <a href="/" class="site-title">br1<span>·portfolio</span></a>
      
      <div class="header-controls">
        <!-- Font style examples: Space Grotesk, Syne, Manrope, Plus Jakarta Sans -->
        <div class="font-switcher" id="fontSwitcher">
          <button class="font-btn active" data-font="space">Space</button>
          <button class="font-btn" data-font="syne">Syne</button>
          <button class="font-btn" data-font="manrope">Manrope</button>
          <button class="font-btn" data-font="jakarta">Jakarta</button>
        </div>
        
        <!-- Theme toggle: light / dark / auto -->
        <div class="theme-toggle" id="themeToggle">
          <button class="theme-option active" data-theme="light">☀️ Light</button>
          <button class="theme-option" data-theme="dark">🌙 Dark</button>
          <button class="theme-option" data-theme="auto">💻 Auto</button>
        </div>
      </div>
    </header>

    <main>
      <div class="hero-grid">
        <div class="hero-left">
          <h1 class="large-heading">selected<br>projects</h1>
          <p class="subdued-desc">
            Science communication, genomic tools & interactive experiments — built with clarity.
          </p>
        </div>
        <div class="hero-right">
          <span class="location-tag">📌 github.io</span>
          <span style="font-weight:300; color: var(--text-secondary);">Jekyll + custom UI</span>
        </div>
      </div>

      <!-- Project cards with background images & distortion -->
      <div class="project-showcase">
        <!-- CRISPR project -->
        <a href="https://crispr-blogtest.vercel.app/" class="project-item bg-crispr" target="_blank" rel="noopener noreferrer">
          <div class="project-title">
            CRISPR-Cas9
            <span class="view-label">— view —</span>
          </div>
          <div class="project-meta">
            <span class="project-type">Interactive Blog</span>
            <span class="project-domain">Genomics</span>
          </div>
        </a>
        
        <!-- Second example project -->
        <a href="#" class="project-item bg-lab" style="pointer-events: none; opacity: 0.9;">
          <div class="project-title">
            Lab Notebook
            <span class="view-label">— view —</span>
          </div>
          <div class="project-meta">
            <span class="project-type">Data Visualization</span>
            <span class="project-domain">Bioinformatics</span>
          </div>
        </a>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-left">
        <span>© br1 — <a href="https://github.com/Br1-85667/Br1-85667.github.io" target="_blank">GitHub Pages</a></span>
      </div>
      <div style="display: flex; gap: 1.5rem;">
        <a href="#" style="text-decoration: none; color: var(--text-primary);">CV</a>
        <span style="color: var(--text-muted);">·</span>
        <a href="#" style="text-decoration: none; color: var(--text-primary);">contact</a>
      </div>
    </footer>
  </div>

  <script>
    (function() {
      // ----- THEME LOGIC -----
      const htmlElement = document.documentElement;
      const themeButtons = document.querySelectorAll('#themeToggle .theme-option');
      
      function setTheme(theme) {
        htmlElement.setAttribute('data-theme', theme);
        localStorage.setItem('br1-theme', theme);
        
        themeButtons.forEach(btn => {
          const btnTheme = btn.getAttribute('data-theme');
          if (btnTheme === theme) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
      }
      
      const savedTheme = localStorage.getItem('br1-theme') || 'light';
      setTheme(savedTheme);
      
      themeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const theme = btn.getAttribute('data-theme');
          setTheme(theme);
        });
      });
      
      // ----- FONT SWITCHER -----
      const fontButtons = document.querySelectorAll('#fontSwitcher .font-btn');
      const rootStyle = document.documentElement.style;
      
      const fontMap = {
        space: { primary: "'Space Grotesk', sans-serif", heading: "'Space Grotesk', sans-serif" },
        syne: { primary: "'Syne', sans-serif", heading: "'Syne', sans-serif" },
        manrope: { primary: "'Manrope', sans-serif", heading: "'Manrope', sans-serif" },
        jakarta: { primary: "'Plus Jakarta Sans', sans-serif", heading: "'Plus Jakarta Sans', sans-serif" }
      };
      
      function applyFont(fontKey) {
        const fonts = fontMap[fontKey] || fontMap.space;
        rootStyle.setProperty('--current-font', fonts.primary);
        rootStyle.setProperty('--current-heading', fonts.heading);
        
        fontButtons.forEach(btn => {
          const btnFont = btn.getAttribute('data-font');
          if (btnFont === fontKey) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
        
        localStorage.setItem('br1-font', fontKey);
      }
      
      const savedFont = localStorage.getItem('br1-font') || 'space';
      applyFont(savedFont);
      
      fontButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const fontKey = btn.getAttribute('data-font');
          applyFont(fontKey);
        });
      });
      
      // ----- DISTORTION EFFECT ON HOVER (add/remove class) -----
      const projectItems = document.querySelectorAll('.project-item');
      
      projectItems.forEach(item => {
        const titleElement = item.querySelector('.project-title');
        if (!titleElement) return;
        
        item.addEventListener('mouseenter', () => {
          titleElement.classList.add('distort-text');
        });
        
        item.addEventListener('mouseleave', () => {
          titleElement.classList.remove('distort-text');
        });
      });
      
      console.log('✨ br1 portfolio – distortion & green hover active.');
    })();
  </script>
</body>
</html>
